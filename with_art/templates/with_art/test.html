{% include 'with_art/base.html' %} {% block content %} {% load static %}

<style type="text/css">
  body,
  html {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background-color: transparent;
  }

  .background {
    animation: fadeIn 2s linear 16s forwards;
    position: fixed;
    top: -10%;
    left: 0;
    width: 50%;
    height: 50%;

    opacity: 0;
    z-index: 1;

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }

  @font-face {
    font-family: "Blanka-Regular";
    src: url("{% static 'with_art/Blanka-Regular.otf' %}") format("opentype");

    font-weight: normal;
    font-style: normal;
  }

  canvas {
    display: block;
  }

  .text-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 1;

    font-family: "Blanka-Regular", sans-serif, red;
    position: fixed; /* Keep the logo fixed in the viewport */
    top: 40%; /* Center the container vertically */
    left: 50%; /* Center the container horizontally */
    transform: translate(
      -50%,
      -50%
    ); /* Offset the container by 50% of its width and height to perfectly center it */
  }

  .text-item {
    position: absolute;
    opacity: 0;
  }
  .red {
    color: #b10a0a;
  }

  .black {
    color: black;
  }

  /* Fade in/out animations */
  @keyframes fadeInOut {
    0%,
    100% {
      opacity: 0;
    }
    10%,
    90% {
      opacity: 1;
    }
  }

  @keyframes fadeIn {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }

  /* Applying animations */
  .text-item:nth-child(1) {
    font-size: 2rem;
    animation: fadeInOut 2s linear forwards;
  }

  .text-item:nth-child(2) {
    font-size: 2.5rem;
    animation: fadeInOut 2s linear 2s forwards;
  }

  .text-item:nth-child(3) {
    font-size: 3rem;
    animation: fadeInOut 2s linear 4s forwards;
  }

  .text-item:nth-child(4) {
    font-size: 3.5rem;
    animation: fadeInOut 2s linear 6s forwards;
  }

  .text-item:nth-child(5) {
    font-size: 4rem;
    animation: fadeInOut 2s linear 8s forwards;
  }

  .text-item:nth-child(6) {
    font-size: 4.5rem;
    animation: fadeInOut 2s linear 10s forwards;
  }

  .text-item:nth-child(7) {
    font-size: 5rem;
    animation: fadeInOut 2s linear 12s forwards;
  }

  .text-item:nth-child(8) {
    font-size: 6rem;
    animation: fadeInOut 2s linear 14s forwards;
  }

  .text-item:nth-child(9) {
    font-size: 8rem;
    animation: fadeIn 2s linear 16s forwards;
  }
</style>

<body>
  <div class="background">
    <img src="{% static 'with_art/background6.jpeg' %}" alt="" />
  </div>
  <div class="text-container">
    <p class="text-item">
      <span class="red">WITH&nbsp; </span><span class="black">PAINTING</span>
    </p>
    <p class="text-item">
      <span class="red">WITH&nbsp; </span><span class="black">DRAWING</span>
    </p>
    <p class="text-item">
      <span class="red">WITH&nbsp; </span><span class="black">SCULPTURE</span>
    </p>
    <p class="text-item">
      <span class="red">WITH&nbsp; </span><span class="black">PHOTOGRAPHY</span>
    </p>
    <p class="text-item">
      <span class="red">WITH&nbsp; </span><span class="black">VIDEO</span>
    </p>
    <p class="text-item">
      <span class="red">WITH&nbsp; </span><span class="black">SOUND</span>
    </p>
    <p class="text-item">
      <span class="red">WITH&nbsp; </span
      ><span class="black">INSTALLATION</span>
    </p>
    <p class="text-item">
      <span class="red">WITH&nbsp; </span><span class="black">WORDS</span>
    </p>
    <p class="text-item">
      <span class="red">WITH&nbsp; </span><span class="black">ART</span>
    </p>
  </div>
</body>

{% endblock %}
